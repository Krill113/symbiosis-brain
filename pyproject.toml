[project]
name = "symbiosis-brain"
dynamic = ["version"]
description = "MCP memory server with semantic search, graph, and bi-temporal tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Voznesenskij" }]
requires-python = ">=3.12"
keywords = ["mcp", "memory", "claude", "semantic-search", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Upper bound: mcp 2.0.0 dropped the decorator API this server is built on
    # (`@app.list_tools()` / `@app.call_tool()` on mcp.server.Server). Until the
    # 2.x port lands, a fresh resolve must stay on 1.x.
    "mcp>=1.0.0,<2.0.0",
    "python-frontmatter>=1.1.0",
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/Krill113/symbiosis-brain"
Repository = "https://github.com/Krill113/symbiosis-brain"
Issues = "https://github.com/Krill113/symbiosis-brain/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
symbiosis-brain = "symbiosis_brain.install_cli:main"
brain-cli = "symbiosis_brain.scope_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbiosis_brain"]

[tool.hatch.build.targets.wheel.force-include]
"src/symbiosis_brain/data/tool-routing.json" = "symbiosis_brain/data/tool-routing.json"
"hooks" = "symbiosis_brain/hooks"
"skills" = "symbiosis_brain/skills"
"templates" = "symbiosis_brain/templates"

[tool.hatch.build.targets.sdist]
include = ["src/symbiosis_brain", "hooks", "skills", "templates", "tests", "README.md", "LICENSE"]

[tool.hatch.version]
path = "src/symbiosis_brain/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    # A DeprecationWarning in our own code is a scheduled outage, not noise: the
    # sqlite3 date-adapter one sat in a green log as "6 warnings" for months
    # (D-N2). Silence third-party noise with a targeted ignore below, never by
    # relaxing this line.
    "error::DeprecationWarning",
    # python-frontmatter's load() still opens files through codecs.open(),
    # deprecated in 3.14 (site-packages/frontmatter/__init__.py:161). Upstream's
    # line, not ours — drop this entry once python-frontmatter stops using it.
    "ignore::DeprecationWarning:frontmatter",
]
